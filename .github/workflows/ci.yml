name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt==4.0.1
          pip install -r app/requirements.txt
          pip install pytest pytest-cov httpx
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: Lint with flake8
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: icafe-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker container starts
        run: |
          docker run -d --name icafe-test -p 8000:8000 icafe-app:test
          sleep 5
          docker ps | grep icafe-test
          echo "Container is running"
      
      - name: Test API health
        run: |
          curl -f http://localhost:8000/docs || exit 1
          echo "API docs accessible"
      
      - name: View container logs
        if: always()
        run: docker logs icafe-test
      
      - name: Cleanup
        if: always()
        run: |
          docker stop icafe-test || true
          docker rm icafe-test || true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      
      - name: Verify application starts
        run: |
          python -c "from app.main import app; print('Application loaded successfully')"
      
      - name: Create build artifact
        run: |
          mkdir -p dist
          cp -r app dist/
          cp README.md dist/ 2>/dev/null || true
          echo "Build completed at $(date)" > dist/BUILD_INFO.txt
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: icafe-app-${{ github.sha }}
          path: dist/
          retention-days: 7
