[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = app
omit = 
    app/__pycache__/*
    */test_*
    */__init__.py

[coverage:report]
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
